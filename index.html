<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Futsal AFA en Vivo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#09131f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: una columna tipo app de resultados; bloques por torneo; detalle en hoja que sube desde abajo */
  --bg:#09131f;
  --card:#0f1e30;
  --card2:#132840;
  --line:#1d3552;
  --grid:#2f5070;        /* líneas entre partidos, más claras */
  --ink:#eef4fb;
  --muted:#8aa3c0;
  --accent:#74b9ec;      /* celeste AFA */
  --live:#ffb020;        /* en vivo */
  --pend:#ff5a5f;        /* sin validar */
  --ok:#3ecf8e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 12px 40px}

.prueba{background:#3a2a05;color:#ffd27a;border:1px solid #6b4d0e;border-radius:10px;padding:5px 10px;margin:0 0 6px;font-size:13px;text-align:center}
/* Encabezado */
header{display:flex;align-items:flex-start;gap:9px;padding:16px 4px 10px}
.logo{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.5px;line-height:1;text-transform:uppercase}
.logo b{color:var(--accent)}
.logo small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:6px;text-align:center}
.logo{flex:1}
.escudo{width:24px;height:28px;flex:none}
.logo .tit{display:flex;align-items:center;justify-content:center;gap:9px}

/* Rama */
.rama{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin:0 0 12px}
.rama button{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.5px;padding:6px 0;color:var(--muted);border-bottom:3px solid transparent}
.rama button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Botones grandes */
.vistas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px}
.vistas button{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.5px;padding:6px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.vistas button[aria-pressed="true"]{background:var(--accent);color:#06121f;border-color:var(--accent)}

/* Barra de fecha (agenda) */
.dia{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);align-items:stretch;background:var(--card);border-radius:14px;margin-bottom:12px;overflow:hidden}
.dianav{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;align-items:center;border-right:1px solid var(--line)}
.dianav .flecha{height:42px;font-size:22px;color:var(--ink)}
.dialbl{position:relative;text-align:center;font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dialbl{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer;padding:12px 0;border-radius:8px;transition:background .2s}
.dialbl.apretando{background:var(--card2)}
.dialbl small{font-size:10px;color:var(--muted)}
/* calendario propio */
.cal{background:var(--card);border-radius:14px;padding:10px}
.calnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:8px}
.calnav b{text-align:center;font-family:var(--display);font-size:18px;text-transform:uppercase}
.calnav button{height:40px;font-size:22px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calg .dn{font-size:11px;color:var(--muted);padding:4px 0}
.calg button{height:40px;border-radius:8px;font-weight:600;position:relative}
.calg button.hay::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.calg button.hoy{outline:1px solid var(--accent)}
.calg button.sel{background:var(--accent);color:#06121f}
.calg button.sel::after{background:#06121f}
.filtros{display:contents}
.filtros button{font-family:var(--display);font-weight:700;font-size:15px;padding:0 4px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.filtros button+button{border-left:1px solid var(--line)}
.filtros button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filtros button.vivo[aria-pressed="true"]{border-bottom-color:var(--live);color:var(--live)}

.publi{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}

/* Bloque de torneo */
.bloque{background:var(--card);border-radius:14px;margin-bottom:12px;overflow:hidden}
.bhead{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;text-align:left}
.bhead h2{margin:0;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.4px;text-transform:uppercase;text-wrap:balance}
.bhead .sub{font-size:12px;color:var(--muted);font-weight:500}
.chev{font-size:20px;color:var(--muted);transition:transform .15s}
.bloque.cerrado .chev{transform:rotate(180deg)}
.bloque.cerrado .bbody{display:none}
.bpie{display:block;width:100%;text-align:center;padding:10px;border-top:1px solid var(--grid);font-family:var(--display);font-weight:700;font-size:15px;color:var(--accent);letter-spacing:.3px}

/* Fila de partido */
.p{display:block;width:100%;text-align:left;border-top:1px solid var(--grid)}
.prow{display:grid;grid-template-columns:52px minmax(0,1fr) 62px minmax(0,1fr);align-items:stretch;min-height:42px}
.est{align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--grid);font-family:var(--body);font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.est.vivo,.est.et{color:var(--live)}
.est .hact{font-size:10.5px;font-weight:500;color:var(--muted);margin-top:2px}
.est .punto{width:7px;height:7px;border-radius:50%;background:var(--live);margin-bottom:3px;animation:lat 1.2s infinite}
@keyframes lat{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.est .punto{animation:none}}
.eq{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:13px;padding:6px;line-height:1.15;min-width:0}
.eq>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sc{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--grid);border-right:1px solid var(--grid);font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sc{flex-direction:column}
.sc .pen{font-family:var(--body);font-size:10px;font-weight:600;color:var(--muted);line-height:1}
.sc.prog{color:var(--muted);font-size:16px}
.sc.vivo{color:var(--live)}
.sc.pend{color:var(--pend)}
.act{font-size:11px;color:var(--muted);border-top:1px solid var(--grid);padding:3px 10px;text-align:center}
.act b{color:var(--live);font-weight:600}
.vacio{padding:26px 16px;text-align:center;color:var(--muted)}

/* Tablas */
.selrow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
select{flex:1;font:inherit;font-weight:700;font-family:var(--display);font-size:18px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:10px;padding:4px;margin-bottom:10px}
.seg button{font-family:var(--display);font-weight:700;font-size:16px;padding:8px;border-radius:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--ink)}
.chips{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-bottom:10px}
.chips button{font-family:var(--display);font-weight:700;font-size:15px;padding:6px 0;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#06121f}
.tabla{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:12px}
.ttit{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;font-family:var(--display);font-weight:800;font-size:18px;text-transform:uppercase}
.scrollx{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;white-space:nowrap;background:var(--card)}
th{font-size:13px;font-weight:600;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line);font-size:14px}
tbody tr:nth-child(even) td{background:#112236}
td.pos{font-family:var(--display);font-weight:800;font-size:16px;width:30px;min-width:30px;color:var(--muted)}
td.eqt{text-align:left;font-weight:700;width:112px;min-width:112px;max-width:112px;overflow:hidden;text-overflow:ellipsis}
td.eqt button{text-align:left;font-weight:700}
td.pts{font-family:var(--display);font-weight:800;font-size:17px;width:38px;min-width:38px}
/* columnas fijas: #, Equipo, Pts y J; el resto se corre con el dedo */
.fija{position:sticky;z-index:1}
.f1{left:0}.f2{left:30px}.f3{left:142px}.f4{left:180px;width:34px;min-width:34px;box-shadow:inset -1px 0 0 var(--line)}
td button.jbtn{color:var(--accent);font:inherit;width:100%}
th.eqt{text-align:left;width:112px;min-width:112px}
.ult{display:inline-flex;gap:2px}
.ult i{font-style:normal;font-size:11px;font-weight:700;width:17px;height:17px;line-height:17px;border-radius:3px;color:#06121f}
.ult .V{background:var(--ok)}.ult .E{background:#f2c94c}.ult .D{background:var(--pend)}
.rojo{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pend)}
.fnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:var(--card2);border-radius:12px;margin-bottom:8px}
.flbl{position:relative;text-align:center;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.5px}
.flbl select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.fnav .flecha{height:42px;font-size:22px}
.diah{text-align:center;font-size:13px;color:var(--muted);padding:6px;border-top:1px solid var(--grid)}
.leyenda{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:-4px 2px 14px}
.leyenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}

/* Hoja de detalle */
.velo{position:fixed;inset:0;background:rgba(3,8,14,.7);display:none;z-index:10}
.velo.on{display:block}
.hoja{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;border-top:1px solid var(--line);z-index:11;transform:translateY(100%);transition:transform .2s}
.hoja.on{transform:none}
@media (prefers-reduced-motion:reduce){.hoja{transition:none}}
.hin{max-width:720px;margin:0 auto;padding:10px 14px 30px}
.htop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.miga{font-size:14px;color:var(--muted)}
.miga b{color:var(--accent);font-weight:600}
.cerrar{font-size:15px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.marc{background:var(--card);border-radius:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 10px;text-align:center;margin-bottom:10px}
.marc .n{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1}
.marc .r{font-family:var(--display);font-weight:800;font-size:40px;padding:0 10px;font-variant-numeric:tabular-nums}
.marc .r small{font-size:20px;padding:0 6px;vertical-align:middle}
.marc .s{grid-column:1/-1;font-size:14px;color:var(--muted);margin-top:4px}
.valchip{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;margin:0 auto 10px}
.valchip.ok{background:rgba(62,207,142,.15);color:var(--ok)}
.valchip.no{background:rgba(255,90,95,.15);color:var(--pend)}
.mam{background:var(--card);border-radius:14px;overflow:hidden}
.mam h3{margin:0;padding:11px 14px;font-family:var(--display);font-weight:800;font-size:18px;text-transform:uppercase}
.ev{display:grid;grid-template-columns:56px 1fr;gap:4px 10px;padding:10px 14px;border-top:1px solid var(--line)}
.ev .m{font-family:var(--display);font-weight:800;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.ev .t{font-weight:700}
.ev .q{grid-column:2;font-size:13px;color:var(--muted)}
.ev.hito{grid-template-columns:1fr;text-align:center;background:rgba(255,255,255,.02)}
.ev.hito .t{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.3px;text-transform:uppercase}
.ev.hito .q{grid-column:1}
.lst .eq.yo{color:var(--ink);font-size:14.5px;font-weight:800}.lst .eq.otro{color:var(--muted);font-weight:600}

footer{margin-top:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
@media (max-width:400px){
  .prow{grid-template-columns:48px minmax(0,1fr) 56px minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="prueba" role="note"><b>WEB · Versión de prueba.</b> Datos de ejemplo.</div>
  <header>
    <!-- lugar del escudo de AFA: reemplazar por el archivo oficial -->
    <div class="logo"><div class="tit"><svg class="escudo" viewBox="0 0 30 36" aria-label="Escudo (provisorio)"><path d="M15 1L28 5v12c0 9-6 15-13 18C8 32 2 26 2 17V5z" fill="none" stroke="#74b9ec" stroke-width="2.4"/><text x="15" y="21" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="10" fill="#74b9ec">AFA</text></svg><span>Futsal <b>AFA</b> en Vivo</span></div><small>Resultados y tablas de todas las categorías</small></div>
  </header>

  <div class="vistas">
    <button id="vA" aria-pressed="true">AGENDA</button>
    <button id="vT" aria-pressed="false">TABLAS</button>
  </div>

  <nav class="rama" aria-label="Rama">
    <button id="rM" aria-pressed="true">MASCULINO</button>
    <button id="rF" aria-pressed="false">FEMENINO</button>
  </nav>

  <main id="main"></main>

  <footer>
    <label class="toggle"><input type="checkbox" id="comision"> Ver como Comisión / Referente</label>
    <div class="leyenda" style="margin:0 2px"><span style="--c:var(--live)">En vivo</span><span style="--c:var(--pend)">Finalizado sin validar</span><span style="--c:var(--ink)">Validado</span></div>
    <div id="notaT" style="margin:-4px 2px 0;font-size:12px;text-align:center">Las tablas se actualizan al finalizar cada partido.</div>
  </footer>
</div>

<div class="velo" id="velo"></div>
<div class="hoja" id="hoja" role="dialog" aria-modal="true"><div class="hin" id="hin"></div></div>

function claseSc(m){return m.est==="prog"?"prog":(m.est==="vivo"||m.est==="et")?"vivo":(m.valid?"":"pend");}
function textoSc(m){return m.est==="prog"?"-":m.gl+" - "+m.gv+(m.pen?'<small class="pen">('+m.pen+' pen.)</small>':"");}
function horaAct(m){var ini=hm2min(m.hora);if(m.est==="et")return min2hm(ini+28);return min2hm(ini+(m.per==="2T"?45:0)+Math.round((20-m.reloj)*1.5)+1);}
function filaPartido(m,conAct,yo){
 function ce(n){return yo?(n===yo?" yo":" otro"):"";}
 var h='<button class="p" data-m="'+m.id+'"><div class="prow">'+celdaEstado(m)+'<div class="eq L'+ce(m.L)+'"><span>'+esc(corto(m.L))+'</span></div><div class="sc '+claseSc(m)+'">'+textoSc(m)+'</div><div class="eq'+ce(m.V)+'"><span>'+esc(corto(m.V))+"</span></div></div>";
  return h+"</button>";}

function etiquetaDia(d){var dif=Math.round((d-hoy)/864e5);
 if(dif===0)return"Hoy";if(dif===-1)return"Ayer";if(dif===1)return"Mañana";return fCorta(d);}
function isoDia(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* ---------- AGENDA ---------- */
function renderAgenda(){
 var delDia=PARTIDOS.filter(function(m){return m.t.rama===S.rama&&m.cat==="1a"&&mismaFecha(m.date,S.dia);});
 var enVivo=delDia.filter(function(m){return m.est==="vivo"||m.est==="et";});
 var lista=S.filtro==="vivo"?enVivo:delDia;
 var h='<section class="dia"><div class="dianav"><button class="flecha" id="dAnt" aria-label="Día anterior">‹</button>'+
  '<div class="dialbl" id="dLbl" role="button" tabindex="0" aria-label="Mantener apretado para abrir el calendario">'+etiquetaDia(S.dia)+' <small>▾</small></div>'+
  '<button class="flecha" id="dSig" aria-label="Día siguiente">›</button></div>'+
  '<div class="filtros"><button id="fT" aria-pressed="'+(S.filtro==="todos")+'">TODOS</button><button id="fV" class="vivo" aria-pressed="'+(S.filtro==="vivo")+'">EN VIVO ('+enVivo.length+")</button></div></section>";
 var hay=false;
 TORNEOS[S.rama].forEach(function(t){
  var ps=lista.filter(function(m){return m.t===t;}).sort(function(a,b){return hm2min(a.hora)-hm2min(b.hora);});
  if(!ps.length)return;hay=true;
  var cerrado=S.cerrados[t.id];
  h+='<section class="bloque'+(cerrado?" cerrado":"")+'"><button class="bhead" data-tog="'+t.id+'"><div><h2>'+esc(t.nombre)+'</h2><div class="sub">'+ps.map(etiqFecha).filter(function(x,i,a){return a.indexOf(x)===i;}).join(" · ")+'</div></div><span class="chev">▴</span></button><div class="bbody">'+
   ps.map(function(m){return filaPartido(m,true);}).join("")+
   '<button class="bpie" data-sec="'+t.id+'">TABLAS DE '+esc(t.nombre.toUpperCase())+" ›</button></div></section>";});
 if(!hay)h+='<div class="bloque"><div class="vacio">'+(S.filtro==="vivo"?"No hay partidos de 1a en vivo en este momento.":"No hay partidos de 1a este día.")+"</div></div>";
 return h;}

/* ---------- TABLAS ---------- */
function calcTabla(t,cat){
 var filas={};t.eq.forEach(function(e){if(e==="Libre")return;filas[e]={eq:e,pts:0,j:0,g:0,e:0,p:0,gf:0,gc:0,ult:[],pend:[]};});
 PARTIDOS.filter(function(m){return m.t===t&&m.cat===cat&&m.est==="fin";}).sort(function(a,b){return a.fecha-b.fecha;}).forEach(function(m){
  var a=filas[m.L],b=filas[m.V];a.j++;b.j++;a.gf+=m.gl;a.gc+=m.gv;b.gf+=m.gv;b.gc+=m.gl;
  if(m.gl>m.gv){a.g++;b.p++;a.pts+=3;a.ult.push("V");b.ult.push("D");}
  else if(m.gl<m.gv){b.g++;a.p++;b.pts+=3;a.ult.push("D");b.ult.push("V");}
  else{a.e++;b.e++;a.pts++;b.pts++;a.ult.push("E");b.ult.push("E");}
  if(!m.valid){a.pend.push(m);b.pend.push(m);}});
 return Object.keys(filas).map(function(k){return filas[k];}).sort(function(x,y){return y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf||x.eq.localeCompare(y.eq);});}

function renderTablas(){
 var t=torneoAct();var cats=t.cats.filter(function(c){return c!=="1a";});var tienePri=t.cats.indexOf("1a")>=0;
 if(cats.indexOf(S.cat)<0)S.cat=cats[0];
 var grupo=!tienePri?"inf":(!cats.length?"pri":S.grupo);
 var cat=grupo==="pri"?"1a":S.cat;
 var h='<div class="selrow"><select id="selT" aria-label="Torneo">'+TORNEOS[S.rama].map(function(x){return'<option value="'+x.id+'"'+(x.id===t.id?" selected":"")+">"+esc(x.nombre)+" · "+(S.rama==="M"?"Masculino":"Femenino")+"</option>";}).join("")+"</select></div>";
 if(tienePri&&cats.length)h+='<div class="seg"><button id="gP" aria-pressed="'+(grupo==="pri")+'">PRIMERA</button><button id="gI" aria-pressed="'+(grupo==="inf")+'">INFERIORES</button></div>';
 if(t.tipo==="elim"){
  t.inst.forEach(function(ins,ii){var ps=PARTIDOS.filter(function(m){return m.t===t&&m.fecha===ii+1;});
   h+='<section class="tabla lst"><div class="ttit"><span>'+esc(ins.n)+'</span><span style="font-size:12px;color:var(--muted);font-family:var(--body);text-transform:none;font-weight:500">'+fCorta(ps[0].date)+"</span></div>"+ps.map(function(m){return filaPartido(m,false);}).join("")+"</section>";});
  return h+'<div class="leyenda"><span style="--c:var(--muted)">Eliminación directa: sin tabla de posiciones</span></div>';}
 var fk=t.id;if(!S.fecha[fk])S.fecha[fk]=t.fa;var fecha=S.fecha[fk];
 if(grupo==="inf")h+='<div class="chips">'+cats.map(function(c){return'<button data-cat="'+c+'" aria-pressed="'+(c===S.cat)+'">'+c+"</button>";}).join("")+"</div>";
 var filas=calcTabla(t,cat);
 h+='<section class="tabla"><div class="ttit"><span>'+esc(t.nombre)+" · "+cat+'</span></div><div class="scrollx"><table><thead><tr><th class="fija f1">#</th><th class="eqt fija f2">Equipo</th><th class="fija f3">Pts</th><th class="fija f4">J</th><th>GF</th><th>GC</th><th>DG</th><th>G</th><th>E</th><th>P</th><th>Últimos 3</th>'+(S.comision?"<th>Val.</th>":"")+"</tr></thead><tbody>"+
  filas.map(function(f,i){var dg=f.gf-f.gc;return'<tr><td class="pos fija f1">'+(i+1)+'</td><td class="eqt fija f2"><button data-eq="'+esc(f.eq)+'">'+esc(corto(f.eq))+'</button></td><td class="pts fija f3">'+f.pts+'</td><td class="fija f4"><button class="jbtn" data-eq="'+esc(f.eq)+'" aria-label="Partidos jugados de '+esc(f.eq)+'">'+f.j+"</button></td><td>"+f.gf+"</td><td>"+f.gc+"</td><td>"+(dg>0?"+":"")+dg+"</td><td>"+f.g+"</td><td>"+f.e+"</td><td>"+f.p+'</td><td><span class="ult">'+f.ult.slice(-3).map(function(u){return'<i class="'+u+'">'+u+"</i>";}).join("")+"</span></td>"+
   (S.comision?"<td>"+(f.pend.length?'<button class="rojo" data-pend="'+esc(f.eq)+'" aria-label="Ver partidos sin validar de '+esc(f.eq)+'"></button>':"")+"</td>":"")+"</tr>";}).join("")+
  "</tbody></table></div></section>";
 // fecha
 var ps=PARTIDOS.filter(function(m){return m.t===t&&m.cat===cat&&m.fecha===fecha;}).sort(function(a,b){return a.date-b.date||hm2min(a.hora)-hm2min(b.hora);});
 var opts="";for(var f=1;f<=t.fechas;f++)opts+='<option value="'+f+'"'+(f===fecha?" selected":"")+">Fecha "+f+"</option>";
 h+='<section class="tabla lst"><div class="fnav"><button class="flecha" id="fAnt" aria-label="Fecha anterior">‹</button><label class="flbl">FECHA '+fecha+' &nbsp;▾<select id="selF" aria-label="Elegir fecha">'+opts+'</select></label><button class="flecha" id="fSig" aria-label="Fecha siguiente">›</button></div>';
 var diaAnt=null;ps.forEach(function(m){if(!diaAnt||!mismaFecha(diaAnt,m.date)){h+='<div class="diah">'+fCorta(m.date)+"</div>";diaAnt=m.date;}h+=filaPartido(m,false);});
 h+="</section>";
 return h;}
var REFS='<div class="leyenda"><span style="--c:var(--live)">En vivo</span><span style="--c:var(--pend)">Finalizado sin validar</span><span style="--c:var(--ink)">Validado</span></div>';

/* ---------- hojas ---------- */
function abrirHoja(html){document.getElementById("hin").innerHTML=html;document.getElementById("velo").classList.add("on");document.getElementById("hoja").classList.add("on");document.getElementById("hoja").scrollTop=0;}
function cerrarHoja(){document.getElementById("velo").classList.remove("on");document.getElementById("hoja").classList.remove("on");}

function detalle(m){
 var estado=m.est==="vivo"?(m.per+" "+String(m.reloj).padStart(2,"0")+"' · Actualizado "+fCorta(m.date)+" · "+horaAct(m)):m.est==="et"?("Entretiempo · Actualizado "+fCorta(m.date)+" · "+horaAct(m)):m.est==="fin"?"Final":(fCorta(m.date)+" · "+m.hora);
 var mid=m.est==="prog"?'<span style="color:var(--muted);font-size:18px">vs</span>':(m.gl+(m.est==="et"?" <small style=\"color:var(--live)\">ET</small> ":" - ")+m.gv);
 var col=m.est==="vivo"||m.est==="et"?"var(--live)":(m.est==="fin"&&!m.valid)?"var(--pend)":"var(--ink)";
 var h='<div class="htop"><div class="miga">'+esc(m.t.nombre)+" · "+etiqFecha(m)+(m.cat==="1a"?"":" · "+m.cat)+' › <b>'+esc(corto(m.L))+" vs. "+esc(corto(m.V))+'</b></div><button class="cerrar" data-cerrar>Cerrar</button></div>';
 h+='<div class="marc"><div class="n">'+esc(corto(m.L))+'</div><div class="r" style="color:'+col+'">'+mid+'</div><div class="n">'+esc(corto(m.V))+'</div><div class="s">'+estado+"</div></div>";
 if(m.est==="fin")h+='<div style="text-align:center"><span class="valchip '+(m.valid?"ok":"no")+'">'+(m.valid?"✓ Validado":"Sin validar · resultado provisorio")+"</span></div>";
 if(m.est==="prog"){h+='<section class="mam"><h3>Programación</h3><div class="ev hito"><div class="t">'+fCorta(m.date)+" · "+m.hora+'</div><div class="q">El resultado aparece acá cuando empiece el partido.</div></div></section>';return h+CERRAR_ABAJO;}
 var evs=[];
 var ini=hm2min(m.hora),puesto2T=false;
 var p1=m.ev.filter(function(g){return g.per==="1T";}),p1l=p1.filter(function(g){return g.lado==="L";}).length,p1v=p1.length-p1l;
 var etTxt={hito:"Entretiempo · "+p1l+" - "+p1v,q:"Informó "+m.delL+" (Delegado de "+m.L+") · "+min2hm(ini+28)};
 m.ev.forEach(function(g){
  if(g.per==="2T"&&!puesto2T){evs.push(etTxt);puesto2T=true;}
  evs.push({m:g.per+" "+String(g.reloj).padStart(2,"0")+"'",t:"Gol de "+corto(g.lado==="L"?m.L:m.V)+" · "+g.parcial,q:"Informó "+g.quien.n+" ("+g.quien.r+") · "+g.hora});});
 if(!puesto2T&&(m.est==="et"||(m.est==="vivo"&&m.per==="2T")||m.est==="fin"))evs.push(etTxt);
 if(m.est==="fin"){evs.push({hito:"Final · "+m.gl+" - "+m.gv,q:"Informó "+m.delL+" (Delegado de "+m.L+") · "+m.horaFin});
  if(m.valid)evs.push({hito:"✓ Validado",q:(S.comision?m.validadorNom+" ("+m.validador+")":"Comisión de Futsal")+" · "+m.horaVal});}
 evs.reverse();
 h+='<section class="mam"><h3>Minuto a minuto</h3>'+evs.map(function(e){
  if(e.hito)return'<div class="ev hito"><div class="t">'+esc(e.hito)+"</div>"+(e.q?'<div class="q">'+esc(e.q)+"</div>":"")+"</div>";
  return'<div class="ev"><div class="m">'+e.m+'</div><div class="t">'+esc(e.t)+'</div><div class="q">'+esc(e.q)+"</div></div>";}).join("")+"</section>";
 return h+CERRAR_ABAJO;}
var CERRAR_ABAJO='<div style="text-align:center;margin-top:14px"><button class="cerrar" data-cerrar>Cerrar</button></div>';

function hojaEquipo(nombre,soloPend){
 var t=torneoAct();var cat=(t.cats.indexOf("1a")<0||S.grupo!=="pri")&&t.cats.length>1?S.cat:"1a";
 var ps=PARTIDOS.filter(function(m){return m.t===t&&m.cat===cat&&m.est==="fin"&&(m.L===nombre||m.V===nombre)&&(!soloPend||!m.valid);}).sort(function(a,b){return b.fecha-a.fecha;});
 var h='<div class="htop"><div class="miga">'+esc(t.nombre)+(cat==="1a"?"":" · "+cat)+' › <b>'+esc(corto(nombre))+'</b></div><button class="cerrar" data-cerrar>Cerrar</button></div>';
 h+='<section class="mam lst"><h3>'+(soloPend?"Falta validar ("+ps.length+")":"Partidos jugados ("+ps.length+")")+"</h3>";
 ps.forEach(function(m){h+='<div class="diah">Fecha '+m.fecha+" · "+fCorta(m.date)+"</div>"+filaPartido(m,false,nombre);});
 if(!ps.length)h+='<div class="vacio">Sin partidos.</div>';
 return h+"</section>"+CERRAR_ABAJO;}

/* ---------- render y eventos ---------- */
function render(){
 document.getElementById("rM").setAttribute("aria-pressed",S.rama==="M");document.getElementById("rF").setAttribute("aria-pressed",S.rama==="F");
 document.getElementById("vA").setAttribute("aria-pressed",S.vista==="A");document.getElementById("vT").setAttribute("aria-pressed",S.vista==="T");
 document.getElementById("main").innerHTML=S.vista==="A"?renderAgenda():renderTablas();
 document.getElementById("notaT").style.display=S.vista==="T"?"":"none";}
function buscar(id){for(var i=0;i<PARTIDOS.length;i++)if(PARTIDOS[i].id===id)return PARTIDOS[i];}

document.getElementById("rM").onclick=function(){S.rama="M";render();};
document.getElementById("rF").onclick=function(){S.rama="F";render();};
document.getElementById("vA").onclick=function(){S.vista="A";render();};
document.getElementById("vT").onclick=function(){S.vista="T";render();};
document.getElementById("comision").onchange=function(e){S.comision=e.target.checked;render();};
document.getElementById("velo").onclick=cerrarHoja;
document.addEventListener("keydown",function(e){if(e.key==="Escape")cerrarHoja();});

document.addEventListener("click",function(e){
 var el=e.target.closest("button");if(!el)return;
 if(el.hasAttribute("data-cerrar")){cerrarHoja();return;}
 if(el.dataset.m){abrirHoja(detalle(buscar(el.dataset.m)));return;}
 if(el.dataset.tog){S.cerrados[el.dataset.tog]=!S.cerrados[el.dataset.tog];render();return;}
 if(el.dataset.sec){S.torneo[S.rama]=el.dataset.sec;S.grupo="pri";S.vista="T";render();window.scrollTo(0,0);return;}
 if(el.dataset.eq){abrirHoja(hojaEquipo(el.dataset.eq,false));return;}
 if(el.dataset.pend){abrirHoja(hojaEquipo(el.dataset.pend,true));return;}
 if(el.dataset.cat){S.cat=el.dataset.cat;render();return;}
 var id=el.id;var t=S.vista==="T"?torneoAct():null;
 if(id==="dAnt"){S.dia=addD(S.dia,-1);render();}
 else if(id==="dSig"){S.dia=addD(S.dia,1);render();}
 else if(id==="fT"){S.filtro="todos";render();}
 else if(id==="fV"){S.filtro="vivo";S.dia=new Date(hoy);render();}
 else if(id==="gP"){S.grupo="pri";render();}
 else if(id==="gI"){S.grupo="inf";render();}
 else if(id==="fAnt"&&S.fecha[t.id]>1){S.fecha[t.id]--;render();}
 else if(id==="fSig"&&S.fecha[t.id]<t.fechas){S.fecha[t.id]++;render();}
});
document.addEventListener("change",function(e){
  if(e.target.id==="selT"){S.torneo[S.rama]=e.target.value;render();}
 if(e.target.id==="selF"){S.fecha[torneoAct().id]=+e.target.value;render();}
});

/* calendario: se abre manteniendo apretado el día 1 segundo */
var calMes=null,tPress=null;
function hojaCal(){
 var y=calMes.getFullYear(),mo=calMes.getMonth();var MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
 var dias={};PARTIDOS.forEach(function(m){if(m.t.rama===S.rama&&m.cat==="1a")dias[isoDia(m.date)]=1;});
 var h='<div class="htop"><div class="miga">Elegí un día</div><button class="cerrar" data-cerrar>Cerrar</button></div><div class="cal"><div class="calnav"><button id="cAnt" aria-label="Mes anterior">‹</button><b>'+MESES[mo]+" "+y+'</b><button id="cSig" aria-label="Mes siguiente">›</button></div><div class="calg">';
 ["L","M","M","J","V","S","D"].forEach(function(d){h+='<div class="dn">'+d+"</div>";});
 var primero=new Date(y,mo,1),off=(primero.getDay()+6)%7,ult=new Date(y,mo+1,0).getDate();
 for(var i=0;i<off;i++)h+="<div></div>";
 for(var d=1;d<=ult;d++){var f=new Date(y,mo,d),c=[];if(dias[isoDia(f)])c.push("hay");if(mismaFecha(f,hoy))c.push("hoy");if(mismaFecha(f,S.dia))c.push("sel");
  h+='<button class="'+c.join(" ")+'" data-dia="'+isoDia(f)+'">'+d+"</button>";}
 h+='</div><div class="leyenda" style="margin:10px 2px 0"><span style="--c:var(--accent)">Días con partidos de 1a</span></div></div>';
 abrirHoja(h);}
document.addEventListener("pointerdown",function(e){var l=e.target.closest("#dLbl");if(!l)return;l.classList.add("apretando");
 tPress=setTimeout(function(){l.classList.remove("apretando");calMes=new Date(S.dia.getFullYear(),S.dia.getMonth(),1);hojaCal();},1000);});
["pointerup","pointerleave","pointercancel"].forEach(function(ev){document.addEventListener(ev,function(){clearTimeout(tPress);var l=document.getElementById("dLbl");if(l)l.classList.remove("apretando");});});
document.addEventListener("contextmenu",function(e){if(e.target.closest("#dLbl"))e.preventDefault();});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="dLbl"){calMes=new Date(S.dia.getFullYear(),S.dia.getMonth(),1);hojaCal();}});
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.dia){var p=b.dataset.dia.split("-");S.dia=new Date(+p[0],+p[1]-1,+p[2]);cerrarHoja();render();}
 else if(b.id==="cAnt"){calMes=new Date(calMes.getFullYear(),calMes.getMonth()-1,1);hojaCal();}
 else if(b.id==="cSig"){calMes=new Date(calMes.getFullYear(),calMes.getMonth()+1,1);hojaCal();}});

/* simulación: el reloj de los partidos en vivo baja 1 minuto cada 20 s */
setInterval(function(){var cambio=false;PARTIDOS.forEach(function(m){if(m.est==="vivo"&&m.reloj>1){m.reloj--;cambio=true;}});
 if(cambio&&S.vista==="A"&&!document.getElementById("hoja").classList.contains("on"))render();},20000);

render();
})();
</script>
</body>
